# =====================================================================
#  ShopEase configuration
#  Any key can be overridden by:
#    - a JVM system property, e.g. CATALINA_OPTS="-Ddb.password=secret"
#    - an environment variable, e.g. DB_PASSWORD=secret  (dots -> underscores, upper-case)
# =====================================================================

# ---- MySQL ----
db.driver=com.mysql.cj.jdbc.Driver
db.url=jdbc:mysql://localhost:3306/shopease?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
db.username=root
db.password=root
db.pool.max=10
db.pool.minIdle=2
db.pool.connectionTimeoutMs=30000

# ---- Schema / seed ----
# Creates tables if missing, loads sample products into an empty DB, creates the admin user.
app.db.init=true
app.admin.email=admin@shopease.com
app.admin.password=Admin@123

# ---- Store settings ----
app.store.name=ShopEase
app.currency.symbol=₹
# GST / sales tax rate applied to the cart subtotal
app.tax.rate=0.18
# Orders at or above this subtotal ship free
app.shipping.freeThreshold=999
app.shipping.flatFee=49
app.catalog.pageSize=12
