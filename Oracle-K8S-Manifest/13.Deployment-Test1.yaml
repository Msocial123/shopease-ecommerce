apiVersion: apps/v1
kind: Deployment
metadata:
  name: fitness-deployment
  annotations:
    kubernetes.io/change-cause: "v2.0.0 - probes and resource limits"
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: shopease
  template:
    metadata:
      labels:
        app: shopease
    spec:
      containers:
        - name: shopease
          image: muralisocial123/fitness-tracker:v1.0.0
          ports:
            - containerPort: 8080