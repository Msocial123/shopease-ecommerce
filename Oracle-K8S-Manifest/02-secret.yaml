# Topic: Secrets - passwords
# stringData = written in plain text here, stored base64-encoded by Kubernetes.
# Used as ENVIRONMENT VARIABLES (PostgreSQL + Tomcat) and as a VOLUME (files in /etc/shopease-secret).
#   kubectl get secret shopease-secret -o jsonpath='{.data.DB_PASSWORD}' | base64 -d
# Lab values only. Real environments: kubectl create secret generic shopease-secret --from-literal=...
apiVersion: v1
kind: Secret
metadata:
  name: shopease-secret
type: Opaque
stringData:
  POSTGRES_DB: "shopease"
  POSTGRES_USER: "shopease"
  POSTGRES_PASSWORD: "ShopEase@2026"
  DB_USERNAME: "shopease"
  DB_PASSWORD: "ShopEase@2026"
  APP_ADMIN_PASSWORD: "Admin@2026"
