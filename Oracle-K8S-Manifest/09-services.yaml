# Topic: Service types - ClusterIP, NodePort, LoadBalancer (all select the pods app=shopease)
#
# ClusterIP    - inside the cluster only: http://shopease-svc   (the Ingress uses this one)
# NodePort     - port 30080 on every node:  curl http://$(minikube ip):30080/health
# LoadBalancer - an external IP; on Minikube start "minikube tunnel" in a second terminal, then
#                kubectl get svc shopease-lb   ->  curl http://<EXTERNAL-IP>/health
#   kubectl get svc,endpoints
apiVersion: v1
kind: Service
metadata:
  name: shopease-svc
spec:
  type: ClusterIP
  selector:
    app: shopease
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: shopease-nodeport
spec:
  type: NodePort
  selector:
    app: shopease
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30080
---
apiVersion: v1
kind: Service
metadata:
  name: shopease-lb
spec:
  type: LoadBalancer
  selector:
    app: shopease
  ports:
    - port: 80
      targetPort: 8080
